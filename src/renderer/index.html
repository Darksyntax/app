<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>Calliope</title>
  </head>
  <body>
    <div id="titlebar-strip"></div>
    <div id="sidebar-rail">
      <button id="rail-pages" type="button" class="active" title="Pages" aria-label="Pages" aria-pressed="true">
        <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
          <rect x="2.5" y="1.5" width="11" height="13" rx="1.5" />
          <line x1="5" y1="5" x2="11" y2="5" />
          <line x1="5" y1="8" x2="11" y2="8" />
          <line x1="5" y1="11" x2="8.5" y2="11" />
        </svg>
      </button>
      <button id="rail-guide" type="button" title="Markdown Guide" aria-label="Markdown Guide" aria-pressed="false">M↓</button>
      <button id="rail-search" type="button" title="Search All Pages" aria-label="Search All Pages" aria-pressed="false">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
          <circle cx="7" cy="7" r="5" />
          <line x1="10.8" y1="10.8" x2="14.5" y2="14.5" />
        </svg>
      </button>
      <button id="sidebar-toggle" type="button" title="Toggle Sidebar" aria-label="Toggle Sidebar">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.3">
          <rect x="1.5" y="2.5" width="13" height="11" rx="2" />
          <line x1="5.75" y1="2.5" x2="5.75" y2="13.5" />
        </svg>
      </button>
    </div>
    <div id="sidebar-main">
      <div id="sidebar-header">
        <span id="sidebar-title">Pages</span>
        <button id="sidebar-new" type="button" title="New Page" aria-label="New Page">+</button>
      </div>
      <div id="sidebar-list"></div>
      <div id="guide-panel" class="hidden">
        <div class="guide-section">Text</div>
        <div class="guide-row"><code>&num; Heading</code><span>heading 1&ndash;6</span></div>
        <div class="guide-row"><code>**Bold**</code><span>bold</span></div>
        <div class="guide-row"><code>*Italic*</code><span>italic</span></div>
        <div class="guide-row"><code>~~Strike~~</code><span>strike</span></div>
        <div class="guide-row"><code>&grave;Code&grave;</code><span>inline</span></div>
        <div class="guide-row"><code>[Text](url)</code><span>link</span></div>
        <div class="guide-section">Blocks</div>
        <div class="guide-row"><code>&gt; Quote</code><span>quote</span></div>
        <div class="guide-row"><code>&grave;&grave;&grave;code&grave;&grave;&grave;</code><span>code block</span></div>
        <div class="guide-row"><code>---</code><span>divider</span></div>
        <div class="guide-section">Lists</div>
        <div class="guide-row"><code>- Item</code><span>bullet</span></div>
        <div class="guide-row"><code>1. Item</code><span>numbered</span></div>
        <div class="guide-row"><code>- [ ] Task</code><span>task</span></div>
      </div>
      <div id="search-panel" class="hidden">
        <input id="search-input" type="text" placeholder="Search all pages…" autocomplete="off" spellcheck="false" />
        <div id="search-results"></div>
      </div>
      <div id="sidebar-footer">
        <button id="sidebar-import" type="button">Import…</button>
        <button id="sidebar-export" type="button">Export…</button>
      </div>
    </div>
    <div id="editor"></div>
    <div id="modal-overlay" class="hidden">
      <div id="modal" role="alertdialog" aria-modal="true">
        <div id="modal-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="8" x2="12" y2="13" />
            <circle cx="12" cy="16.3" r="0.6" fill="currentColor" stroke="none" />
            <circle cx="12" cy="12" r="9.5" />
          </svg>
        </div>
        <div id="modal-title"></div>
        <div id="modal-detail"></div>
        <div id="modal-actions">
          <button id="modal-cancel" type="button"></button>
          <button id="modal-confirm" type="button"></button>
        </div>
      </div>
    </div>
    <div id="status-bar">
      <button id="hyperfocus-toggle" type="button" title="Toggle Hyperfocus Mode" aria-label="Toggle Hyperfocus Mode">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.3">
          <circle cx="8" cy="8" r="6" />
          <circle cx="8" cy="8" r="3" />
          <circle cx="8" cy="8" r="0.6" fill="currentColor" stroke="none" />
        </svg>
      </button>
      <button id="markup-toggle" type="button" title="Toggle Markdown Syntax" aria-label="Toggle Markdown Syntax">&lt;/&gt;</button>
      <button id="scratchpad-toggle" type="button" title="Scratchpad" aria-label="Toggle Scratchpad">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2.5 2.5h8l3 3v8h-11z" />
          <path d="M10.5 2.5v3h3" />
        </svg>
      </button>
      <button id="theme-toggle" type="button" title="Toggle Theme" aria-label="Toggle Theme">
        <svg viewBox="0 0 16 16" width="14" height="14">
          <mask id="moon-mask">
            <rect width="16" height="16" fill="white" />
            <circle cx="10.5" cy="5.5" r="5.2" fill="black" />
          </mask>
          <circle cx="8" cy="8" r="6" fill="currentColor" mask="url(#moon-mask)" />
        </svg>
      </button>
      <span id="status"></span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>Calliope</title>
  </head>
  <body>
    <div id="titlebar-strip"></div>
    <div id="sidebar">
      <div id="sidebar-header">
        <span id="sidebar-title">Pages</span>
        <button id="sidebar-new" type="button" title="New Page" aria-label="New Page">+</button>
      </div>
      <div id="sidebar-list"></div>
      <div id="sidebar-footer">
        <button id="sidebar-import" type="button">Import…</button>
        <button id="sidebar-export" type="button">Export…</button>
      </div>
    </div>
    <div id="editor"></div>
    <div id="status-bar">
      <button id="markup-toggle" type="button" title="Toggle Markdown Syntax" aria-label="Toggle Markdown Syntax">&lt;/&gt;</button>
      <button id="theme-toggle" type="button" title="Toggle Theme" aria-label="Toggle Theme">
        <svg viewBox="0 0 16 16" width="14" height="14">
          <mask id="moon-mask">
            <rect width="16" height="16" fill="white" />
            <circle cx="10.5" cy="5.5" r="5.2" fill="black" />
          </mask>
          <circle cx="8" cy="8" r="6" fill="currentColor" mask="url(#moon-mask)" />
        </svg>
      </button>
      <button id="sidebar-toggle" type="button" title="Toggle Sidebar" aria-label="Toggle Sidebar">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.3">
          <rect x="1.5" y="2.5" width="13" height="11" rx="2" />
          <line x1="5.75" y1="2.5" x2="5.75" y2="13.5" />
        </svg>
      </button>
      <span id="status"></span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
